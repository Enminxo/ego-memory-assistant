# The four demo scenes: Ego4D NLQ clips (8 min each) chosen because they contain
# QAEgo4D questions in the categories of the project proposal.
# demo_questions are the buttons shown in the app; "expected" is the QAEgo4D answer.
# In each scene the first ones are answered correctly from the diary (open answer checked on
# 2026-10-21 with gemma4:31b); the last ones fail, on purpose, to show where the diary falls short.
scenes:
  - id: gas
    title: "Kitchen: did I turn off the stove?"
    category: appliances
    clip_uid: d6f53591-87e7-49c2-83c6-004da51c2a7a
    demo_questions:
      - {text: "How many glasses of water did I pour into the pot?", expected: "three"}
      - {text: "Where did I put the pot after taking it from the drawer?", expected: "on the cooker"}
      - {text: "How many kinds of vegetables did I cut?", expected: "three"}
      - {text: "Did I turn off the stove?", expected: "no"}           # fails: misreads touching the panel
  - id: keys
    title: "At home: where did I leave my keys?"
    category: objects
    clip_uid: 6b92c1bc-488b-40bb-bd4d-dcf7e08007c7
    demo_questions:
      - {text: "Did I leave the back door open?", expected: "yes"}
      - {text: "Where did I leave my keys?", expected: "on the table"}   # fails: blurred frame
      - {text: "Where is my phone?", expected: "on the table"}          # fails
  - id: meds
    title: "Bathroom routine: medication"
    category: medication
    clip_uid: 7f02b942-1059-4360-9a46-fca699b25627
    demo_questions:
      # Not a QAEgo4D question: checked by eye on the frames (pill bottle, hand, glass of water at 06:45-07:00).
      - {text: "Did I take my pill?", checked: "yes, at 06:45 (checked by eye on the frames)"}
      - {text: "How many medicine bottles did I open?", expected: "three"}   # says two
      - {text: "Did I leave the blinds open?", expected: "yes"}             # half: adjusted, state unknown
      - {text: "Which dog did I feed last?", expected: "black with white dot"}  # fails
  - id: wallet
    title: "Coming home: where is my wallet?"
    category: objects
    clip_uid: 1c865785-9ac6-4f16-baa4-97405aacad6a
    demo_questions:
      - {text: "Where did I wash the dishes?", expected: "at the kitchen sink"}
      - {text: "What did I take out of the fridge?", expected: "a plate"}     # half: opened it, content unclear
      - {text: "Where did I put my wallet?", expected: "at the drawer"}       # fails: wrote keys and phone
