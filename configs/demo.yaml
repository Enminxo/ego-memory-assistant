# Configuration of the demo run on the DGX Spark (Ollama, OpenAI-compatible API).
# The same file pointed at llama-server or vLLM only needs base_url and model changed.

base_url: http://localhost:11434/v1
scenarios_dir: scenarios
data_dir: data            # memories are written to data/memories/<scenario>/<tag>/

describer:
  model: gemma4:31b       # gemma4:e4b is ~4x faster but invents objects (smoke test, 2026-10-21)
  clip_sec: 15
  n_frames: 8             # one frame every ~1.9 s
  max_tokens: 160
  max_words: 60
  temperature: 0.2
  seed: 0
  keep_frames: true       # store the frames of each entry as evidence for the app

reader:
  model: gemma4:31b
  max_tokens: 200
  temperature: 0.0

# A live session from the page (Go live) or egomem-live, e.g. at a demo stand.
live:
  width: 720              # the phone relay scales the diary's photos to this width; at the
                          # full 1600 px the large describer needs ~29 s per 15 s window
  record: true            # each session from the page also starts the Companion app's own
                          # recording on the phone (full video and gaze), stopped and saved on
                          # Stop, to look into what the diary missed. It is saved on the phone;
                          # with Cloud upload on in Companion it also goes to Pupil Cloud
  hint: "Pregunta qué hiciste o dónde dejaste algo. Tu acción tarda unos 30 s en salir en el diario."
  demo_questions:         # buttons of every new live session, for the stand's three actions
    - {text: "¿Qué he hecho hasta ahora?"}
    - {text: "¿Qué cogí con la mano?"}
    - {text: "¿Dónde dejé las llaves?"}
    - {text: "¿Qué bebí?"}
    - {text: "¿Cerré la caja?", hard: true, label: "difícil"}   # a state change, shown on purpose
