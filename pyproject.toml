[project]
name = "ego-memory-assistant"
version = "0.1.0"
description = "Episodic memory assistant prototype: egocentric video to a textual diary that answers questions"
requires-python = ">=3.11"
dependencies = [
    "av",
    "fastapi",
    "numpy",
    "pillow",
    "pyyaml",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[project.scripts]
egomem-scene = "egomem.scenarios:main"
egomem-build = "egomem.build_memory:main"
egomem-eval = "egomem.evaluate:main"
egomem-app = "egomem.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/egomem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
