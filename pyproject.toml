[project]
name = "ego-memory-assistant"
version = "0.1.0"
description = "Episodic memory assistant prototype: egocentric video to a textual diary that answers questions"
requires-python = ">=3.11"
dependencies = [
    "av",
    "fastapi",
    "numpy",
    "pillow",
    "python-multipart>=0.0.32",
    "pyyaml",
    "uvicorn",
]

[project.optional-dependencies]
# Pupil Labs Neon glasses as the camera (egomem-neon, egomem-live, Go live in the app).
neon = [
    "pupil-labs-realtime-api>=1.9",
    "pupil-labs-neon-recording>=2.1",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[project.scripts]
egomem-scene = "egomem.scenarios:main"
egomem-build = "egomem.build_memory:main"
egomem-eval = "egomem.evaluate:main"
egomem-app = "egomem.app:main"
egomem-neon = "egomem.neon:main"
egomem-live = "egomem.live:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/egomem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
